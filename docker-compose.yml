services:
  db:
    image: pgvector/pgvector:pg17
    container_name: contexo-db
    environment:
      POSTGRES_DB: contexo
      POSTGRES_USER: contexo_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contexo_app -d contexo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: